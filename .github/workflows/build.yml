name: Build patch bundle
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build .mpp
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: patches-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep '^version' gradle.properties | cut -d= -f2 | tr -d ' ')
          tag="v$version"
          asset="$RUNNER_TEMP/patches-$version.mpp"
          cp "$(ls patches/build/libs/*.mpp | head -n 1)" "$asset"
          # patches-bundle.json must point at exactly this asset, or Morphe gets a 404.
          grep -q "releases/download/$tag/patches-$version.mpp" patches-bundle.json
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --title "$tag" \
              --notes "bearinmind patches v2.10.0 plus Android Auto patches for Google Maps 26.44.06. Unofficial and untested on device."
          fi
